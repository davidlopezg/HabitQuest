<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HabitQuest - Coach de hábitos</title>
    <meta name="description" content="Coach adaptativo de hábitos: dices tu objetivo y la app adapta tu día a tu energía" />
    <meta name="theme-color" content="#1A1B2F" />
    <link rel="icon" type="image/png" href="/HabitQuest/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/HabitQuest/icons/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/HabitQuest/manifest.webmanifest" />
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Inline for Offline Support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swPath = '/HabitQuest/sw.js';
          navigator.serviceWorker.register(swPath).catch(err => console.log('SW register error', err));
        });
      }
    </script>
  </body>
</html>
